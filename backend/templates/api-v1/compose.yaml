services:
  app:
    build:
      context: .
      network: ${BUILD_NETWORK:-host}
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-23871}:8080"]
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?Use the managed database connector URL}
      APP_DATABASE_SCHEMA: ${APP_DATABASE_SCHEMA:?Use the project schema}
    restart: unless-stopped
